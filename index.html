<main class="wrap">

  <section class="hero" style="border-top:none;">
    <h1 id="heroName"></h1>
    <div class="role-line" id="heroRole"></div>
    <p class="pitch" id="heroPitch"></p>
    <div class="status-bar"><span class="pulse"></span>STATUS: <span id="heroStatus"></span></div>

    <div class="cta-row">
      <button class="btn primary btn-icon active" data-tab="game" type="button" aria-label="Play a game" title="Play a game">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="3" x2="5" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path class="banner-shape" d="M5 4 H17 L14 7.5 L17 11 H5 Z"/>
        </svg>
      </button>
      <button class="btn primary" data-tab="about" type="button"><span id="btnAboutLabel"></span></button>
      <button class="btn primary" data-tab="projects" type="button"><span id="btnProjectsLabel"></span></button>
      <button class="btn primary" data-tab="certs" type="button"><span id="btnCertsLabel"></span></button>
      <a class="btn primary" href="resume.pdf" download>
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M4 19h16"/>
        </svg>
        <span id="btnResumeLabel"></span>
      </a>
    </div>
  </section>

  <div class="details-panel" id="detailsPanel">

  <section id="game" class="tab-section active">
    <div class="game-wrap">
      <iframe
        id="gameFrame"
        src="https://mikrw.github.io/chameleon_game/"
        title="Escape the Terrarium"
        loading="lazy"
      ></iframe>
    </div>
  </section>

  <section id="about" class="tab-section">
    <div class="media-placeholder about-portrait" id="aboutPortrait" data-src="portrait.jpg"></div>
    <h2 class="center">Who I am</h2>
    <div class="about-text center" id="aboutText"></div>
  </section>

  <section id="projects" class="tab-section">
    <div class="featured-project" id="featuredProject"></div>
    <div class="secondary-projects" id="secondaryProjects"></div>
  </section>

  <section id="certs" class="tab-section">
    <h2 class="center">Industry</h2>
    <div class="cert-list center" id="certList"></div>

    <h3 class="cert-subheading center">Education</h3>
    <div class="cert-list center" id="educationList"></div>

    <h3 class="cert-subheading center">Short Courses</h3>
    <div class="cert-list center" id="shortCoursesList"></div>

    <h3 class="cert-subheading center">Hands-On Practice</h3>
    <div class="cert-list center" id="handsOnPracticeList"></div>
  </section>

  <section id="email" class="tab-section contact-section">
    <h2 class="center">Get in touch</h2>
    <p class="about-text center" id="contactIntro"></p>

    <form class="contact-form" id="contactForm" novalidate>
      <div class="form-row">
        <label for="senderName">Your name</label>
        <input type="text" id="senderName" name="name" placeholder="Jane Doe" required autocomplete="name">
      </div>
      <div class="form-row">
        <label for="senderEmail">Your email</label>
        <input type="email" id="senderEmail" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="recipientSelect">Send to</label>
        <select id="recipientSelect" name="recipient" required></select>
      </div>
      <div class="form-row">
        <label for="messageBody">Message</label>
        <textarea id="messageBody" name="message" rows="6" placeholder="What's up?" required></textarea>
      </div>
      <div class="form-actions">
        <button class="btn primary" type="submit" id="contactSubmitBtn">Send Message</button>
        <span class="form-status" id="contactFormStatus" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>

  </div>

</main>

<footer>
  © <span id="year"></span> <span id="footerName"></span> — built with care.
</footer>
